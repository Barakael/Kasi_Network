<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasi WiFi</title>
  <style>
    html { color-scheme: light only; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #e8eef6;
      color: #0b1220;
      font-family: system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 20rem;
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
      border: 1px solid #dbe3ee;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 22px; color: #475569; }
    a {
      display: block;
      min-height: 50px;
      line-height: 50px;
      border-radius: 12px;
      background: #1d4ed8;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kasi Demo WiFi</h1>
    <p>Karibu. Endelea kuona paketi na voucher.</p>
    <a id="go" href="https://net.wayda.co.tz/?site=kasi-demo-site-1">Endelea kwenye Kasi</a>
  </div>
  <script>
    var params = new URLSearchParams({
      site: "kasi-demo-site-1",
      mac: "$(mac)",
      ip: "$(ip)",
      link_login: "$(link-login-only)",
      link_orig: "$(link-orig)",
      chap_id: "$(chap-id)",
      chap_challenge: "$(chap-challenge)",
      error: "$(error)"
    });
    document.getElementById("go").href = "https://net.wayda.co.tz/?" + params.toString();
  </script>
</body>
</html>
