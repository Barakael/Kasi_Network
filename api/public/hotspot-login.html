<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="refresh" content="0;url=http://192.168.88.10:5173/?site=kasi-demo-site-1&mac=$(mac)&ip=$(ip)&link_login=$(link-login-only)&link_orig=$(link-orig)&chap_id=$(chap-id)&chap_challenge=$(chap-challenge)">
