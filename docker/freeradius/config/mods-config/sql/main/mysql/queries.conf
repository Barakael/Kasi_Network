# -*- text -*-
#
# Queries FreeRADIUS runs against the shared Kasi database.
#
# Authorisation, accounting and post-auth all live here. sqlcounter has its
# own query files. Column names match the FreeRADIUS 3.2 MySQL schema that
# Laravel's migrations create.

sql_user_name = "%{User-Name}"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authcheck_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authreply_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_group_check_query = "\
	SELECT id, groupname, attribute, \
	Value, op \
	FROM ${groupcheck_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

authorize_group_reply_query = "\
	SELECT id, groupname, attribute, \
	value, op \
	FROM ${groupreply_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

group_membership_query = "\
	SELECT groupname \
	FROM ${usergroup_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

simul_count_query = "\
	SELECT COUNT(*) \
	FROM ${acct_table1} \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL"

accounting {
	reference = "%{tolower:type.%{Acct-Status-Type}.query}"

	column_list = "\
		acctsessionid, acctuniqueid, username, realm, \
		nasipaddress, nasportid, nasporttype, \
		acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, \
		acctauthentic, connectinfo_start, connectinfo_stop, \
		acctinputoctets, acctoutputoctets, calledstationid, \
		callingstationid, acctterminatecause, servicetype, \
		framedprotocol, framedipaddress"

	type {
		accounting-on {
			query = "\
				UPDATE ${acct_table1} \
				SET acctstoptime = FROM_UNIXTIME(%{%{integer:Event-Timestamp}:-%l}), \
				    acctsessiontime = '%{integer:Event-Timestamp}' - UNIX_TIMESTAMP(acctstarttime), \
				    acctterminatecause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}' \
				WHERE acctstoptime IS NULL \
				AND nasipaddress = '%{NAS-IP-Address}' \
				AND acctstarttime <= FROM_UNIXTIME(%{%{integer:Event-Timestamp}:-%l})"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		start {
			query = "\
				INSERT INTO ${acct_table1} \
					(${column_list}) \
				VALUES \
					('%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					'%{Realm}', \
					'%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					FROM_UNIXTIME(%{%{integer:Event-Timestamp}:-%l}), \
					FROM_UNIXTIME(%{%{integer:Event-Timestamp}:-%l}), \
					NULL, \
					0, \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					'', \
					0, 0, \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					'%{Framed-IP-Address}')"

			query = "\
				UPDATE ${acct_table1} SET \
					acctstarttime = FROM_UNIXTIME(%{%{integer:Event-Timestamp}:-%l}), \
					acctupdatetime = FROM_UNIXTIME(%{%{integer:Event-Timestamp}:-%l}), \
					connectinfo_start = '%{Connect-Info}' \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
				AND acctstoptime IS NULL"
		}

		interim-update {
			query = "\
				UPDATE ${acct_table1} SET \
					acctupdatetime = FROM_UNIXTIME(%{%{integer:Event-Timestamp}:-%l}), \
					acctsessiontime = '%{Acct-Session-Time}', \
					acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}' << 32 | '%{%{Acct-Input-Octets}:-0}', \
					acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}' << 32 | '%{%{Acct-Output-Octets}:-0}', \
					framedipaddress = '%{Framed-IP-Address}' \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
				AND acctstoptime IS NULL"
		}

		stop {
			query = "\
				UPDATE ${acct_table1} SET \
					acctstoptime = FROM_UNIXTIME(%{%{integer:Event-Timestamp}:-%l}), \
					acctsessiontime = '%{Acct-Session-Time}', \
					acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}' << 32 | '%{%{Acct-Input-Octets}:-0}', \
					acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}' << 32 | '%{%{Acct-Output-Octets}:-0}', \
					acctterminatecause = '%{Acct-Terminate-Cause}', \
					connectinfo_stop = '%{Connect-Info}', \
					framedipaddress = '%{Framed-IP-Address}' \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
		}
	}
}

post-auth {
	# Outcome log only. First-use Expiration and MAC binding are issued from
	# the kasi site's post-auth unlang so several statements can run; this
	# section accepts a single query.
	query = "\
		INSERT INTO ${...postauth_table} \
			(username, pass, reply, calledstationid, callingstationid, authdate) \
		VALUES ( \
			'%{User-Name}', \
			'%{%{User-Password}:-Chap-Password}', \
			'%{reply:Packet-Type}', \
			'%{Called-Station-Id}', \
			'%{Calling-Station-Id}', \
			CURRENT_TIMESTAMP())"
}
