<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasi</title>
</head>
<body>
  <script>
    var err = "$(error)";
    var params = new URLSearchParams({
      site: "kasi-demo-site-1",
      view: "packages",
      mac: "$(mac)",
      ip: "$(ip)",
      link_login: "$(link-login-only)",
      link_orig: "$(link-orig)",
      chap_id: "$(chap-id)",
      chap_challenge: "$(chap-challenge)"
    });
    if (err && err.indexOf("$(") === -1) {
      params.set("error", err);
    }
    window.location.replace("https://net.wayda.co.tz/?" + params.toString());
  </script>
</body>
</html>
