# Host nginx — Mailcow proxies HTTPS here on 172.22.1.1:8088 / 127.0.0.1:8088
server {
    listen 127.0.0.1:8088;
    listen 172.22.1.1:8088;
    server_name net.wayda.co.tz;

    absolute_redirect off;
    port_in_redirect off;

    root /var/www/net.wayda.co.tz/portal;
    index index.html;
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://127.0.0.1:8020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8020/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /up {
        proxy_pass http://127.0.0.1:8020/up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /console {
        return 302 /console/;
    }

    location /console/ {
        alias /var/www/net.wayda.co.tz/console/;
        try_files $uri $uri/ @console_spa;
    }

    location @console_spa {
        rewrite ^ /console/index.html last;
    }

    location = /console/index.html {
        alias /var/www/net.wayda.co.tz/console/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
