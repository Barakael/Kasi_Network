# Public nginx on 147.79.101.245 — hasnetworks.co.tz
# Install to: /etc/nginx/sites-available/hasnetworks.co.tz.conf
#   ln -s /etc/nginx/sites-available/hasnetworks.co.tz.conf /etc/nginx/sites-enabled/
# Then: certbot --nginx -d hasnetworks.co.tz
#
# Console (the operator system) is the site root.
# Captive portal lives at /portal so hotspot clients and voucher QR codes
# keep a stable path without occupying the domain.

server {
    server_name hasnetworks.co.tz www.hasnetworks.co.tz;

    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 20M;

    root /var/www/hasnetworks.co.tz/console;
    index index.html;

    # Routers still shipping the old login.html land on /?site=...
    # Send those clients to the portal without touching MikroTik files.
    if ($arg_site) {
        rewrite ^/$ /portal/ redirect;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8020/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /up {
        proxy_pass http://127.0.0.1:8020/up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /portal {
        return 302 /portal/;
    }

    location /portal/ {
        root /var/www/hasnetworks.co.tz;
        add_header Permissions-Policy "camera=(self)" always;
        add_header Feature-Policy "camera 'self'" always;
        try_files $uri $uri/ /portal/index.html;
    }

    location = /console {
        return 302 /;
    }

    location /console/ {
        rewrite ^/console/(.*)$ /$1 redirect;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/hasnetworks.co.tz_access.log;
    error_log  /var/log/nginx/hasnetworks.co.tz_error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hasnetworks.co.tz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hasnetworks.co.tz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = hasnetworks.co.tz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name hasnetworks.co.tz www.hasnetworks.co.tz;
    return 404; # managed by Certbot
}
