# Mailcow edge nginx — HTTPS for net.wayda.co.tz
# Install to: /opt/mailcow-dockerized/data/conf/nginx/net.wayda.co.tz.conf
# Add net.wayda.co.tz to ADDITIONAL_SAN in mailcow.conf, then:
#   cd /opt/mailcow-dockerized && docker compose restart nginx-mailcow acme-mailcow

server {
    listen 80;
    listen [::]:80;
    server_name net.wayda.co.tz;
    root /web;
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name net.wayda.co.tz;

    ssl_certificate /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location / {
        proxy_pass http://172.22.1.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
