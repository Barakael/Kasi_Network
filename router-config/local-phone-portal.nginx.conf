# Use this if you switch Laragon from Apache to Nginx (Menu → Nginx).
# Port must be 80. Phones will not follow :5173 or :8080.

server {
    listen 80;
    server_name wifi.kasi;

    root C:/Users/mushy/Kasi_Network/portal/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
