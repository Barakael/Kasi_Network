# Laragon Apache is already on port 80. Phones will open this; they will not
# open :5173. Copy to C:/laragon/etc/apache2/sites-enabled/ and reload Apache.

<VirtualHost *:80>
    ServerName wifi.kasi
    DocumentRoot "C:/Users/mushy/Kasi_Network/portal/dist"

    <Directory "C:/Users/mushy/Kasi_Network/portal/dist">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
</VirtualHost>
