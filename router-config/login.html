<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wi-Fi login</title>
  <style>
    html { color-scheme: light only; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #e8eef6;
      color: #0b1220;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 22rem;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 28px 20px;
    }
    h1 { margin: 0; font-size: 1.45rem; }
    p { margin: 12px 0 0; color: #1e293b; line-height: 1.45; }
    a {
      display: block;
      margin-top: 22px;
      padding: 16px 18px;
      background: #1d4ed8;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wi-Fi login</h1>
    <p>You are on the hotspot. Tap continue to see packages and enter a voucher.</p>
    <a href="http://portal.kasi.test/?site=$(identity)&amp;mac=$(mac)&amp;ip=$(ip)&amp;link_login=$(link-login-only)&amp;link_orig=$(link-orig)&amp;chap_id=$(chap-id)&amp;chap_challenge=$(chap-challenge)">Continue / Endelea</a>
  </div>
</body>
</html>
