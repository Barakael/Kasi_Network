<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecting…</title>
  <style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0}</style>
</head>
<body>
  <p>Opening the login page…</p>
  <script>
    (function () {
      var params = new URLSearchParams({
        site: "$(identity)",
        mac: "$(mac)",
        ip: "$(ip)",
        link_login: "$(link-login-only)",
        link_orig: "$(link-orig)",
        chap_id: "$(chap-id)",
        chap_challenge: "$(chap-challenge)",
        error: "$(error)"
      });
      window.location.replace("http://portal.kasi.test/?" + params.toString());
    })();
  </script>
  <noscript>
    <a href="http://portal.kasi.test/">Continue</a>
  </noscript>
</body>
</html>
